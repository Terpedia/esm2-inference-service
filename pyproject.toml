[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "terpedia-esm2-service"
version = "0.1.0"
description = "Batched, provenance-verifiable ESM-2 protein embedding service"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.54,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
terpedia-esm2 = "terpedia_esm2.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terpedia_esm2"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
